<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS OS</title>
<style>
  :root { --void:#02050a; --arc:#5cc8ff; --ice:#e6f4ff; --spark:#ffb454; --dim:#5b7a90; --line:#16293a; --bad:#ff7a7a; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--void); color:var(--ice); overflow:hidden;
    font-family:Inter,"Segoe UI",system-ui,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh; padding:3vh 5vw;
    background:radial-gradient(circle at 50% 38%, rgba(92,200,255,.10), transparent 55%); }

  .reactor { position:relative; width:min(44vmin,360px); aspect-ratio:1; transition:width 1.2s cubic-bezier(.2,.8,.2,1); flex:none; }
  .reactor.small { width:min(24vmin,190px); }
  .reactor svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .ring { fill:none; stroke:var(--arc); stroke-linecap:round; opacity:0; transition:opacity .6s, stroke-dashoffset 1.8s cubic-bezier(.2,.7,.2,1); }
  #r1 { stroke-width:1.2; stroke-dasharray:565; stroke-dashoffset:565; }
  #r2 { stroke-width:2.4; stroke-dasharray:36 14 8 14; transform-origin:100px 100px; }
  #r3 { stroke-width:1; stroke-dasharray:3 9; transform-origin:100px 100px; }
  .ring.show { opacity:.85; stroke-dashoffset:0; }
  #r2.show { animation:spin 14s linear infinite; } #r3.show { animation:spin 22s linear infinite reverse; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .core { position:absolute; left:50%; top:50%; width:16%; aspect-ratio:1; border-radius:50%; background:var(--spark);
    transform:translate(-50%,-50%) scale(0); box-shadow:0 0 40px 10px rgba(255,180,84,.55);
    transition:transform .9s cubic-bezier(.2,1.4,.3,1), background 1s, box-shadow 1s; }
  .core.lit { transform:translate(-50%,-50%) scale(1); }
  .core.awake { background:var(--arc); box-shadow:0 0 70px 18px rgba(92,200,255,.5); animation:breathe 3.2s ease-in-out infinite; }
  .core.speak { background:var(--arc); box-shadow:0 0 90px 28px rgba(92,200,255,.7); animation:breathe 1s ease-in-out infinite; }
  .core.listen { background:#7dffb0; box-shadow:0 0 80px 22px rgba(125,255,176,.5); animation:breathe 1.6s ease-in-out infinite; }
  .core.think { background:var(--ice); box-shadow:0 0 60px 14px rgba(230,244,255,.45); animation:breathe .7s ease-in-out infinite; }
  @keyframes breathe { 50% { transform:translate(-50%,-50%) scale(1.16); } }

  h1 { font-weight:200; font-size:clamp(1.8rem,5vw,3rem); letter-spacing:.42em; padding-left:.42em; opacity:0; transition:opacity 1.4s; text-align:center; }
  h1 b { font-weight:600; } h1.on { opacity:1; }
  #line { min-height:2.8em; max-width:42rem; text-align:center; font-size:clamp(1rem,2.1vw,1.3rem); line-height:1.4; }
  #view { width:min(34rem,100%); display:flex; flex-direction:column; gap:.8rem; align-items:stretch; }
  .panel { display:none; flex-direction:column; gap:.8rem; } .panel.on { display:flex; }
  .step { font-size:.8rem; color:var(--dim); text-align:center; }
  input { width:100%; padding:.85rem 1rem; border-radius:10px; border:1px solid var(--line); background:#050b13; color:var(--ice);
    font:inherit; outline:none; } input:focus { border-color:var(--arc); }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-size:.9rem; color:var(--ice); background:transparent; border:1px solid var(--line); border-radius:999px;
    padding:.5rem 1rem; cursor:pointer; } button:hover, button:focus-visible { border-color:var(--arc); outline:none; }
  button.go { background:var(--arc); color:#02121c; border-color:var(--arc); font-weight:600; border-radius:10px; }
  button.mic.on { border-color:#7dffb0; color:#7dffb0; }
  .err { color:var(--bad); font-size:.85rem; min-height:1.2em; text-align:center; }
  a { color:var(--arc); font-size:.85rem; text-align:center; }
  pre { background:#050b13; border:1px solid var(--line); border-radius:10px; padding:1rem; font:12px/1.6 ui-monospace,monospace; color:#9fe8c0; overflow:auto; }
  #log { position:fixed; left:3vw; bottom:3vh; font:12px/1.7 ui-monospace,monospace; color:var(--dim); white-space:pre; transition:opacity 1.2s; }
  #log .ok { color:var(--arc); } #log.fade { opacity:0; }
  @media (max-height:640px) { .reactor.small { width:90px; } }
  @media (prefers-reduced-motion:reduce) { #r2.show,#r3.show,.core.awake,.core.speak,.core.listen,.core.think { animation:none; } }
</style>
</head>
<body>
  <div class="reactor" id="reactor">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle id="r1" class="ring" cx="100" cy="100" r="90"/><circle id="r2" class="ring" cx="100" cy="100" r="72"/><circle id="r3" class="ring" cx="100" cy="100" r="54"/>
    </svg>
    <div class="core" id="core"></div>
  </div>
  <h1 id="title"><b>JARVIS</b> OS</h1>
  <p id="line" aria-live="polite"></p>

  <div id="view">
    <form class="panel" id="p-key">
      <input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="Gemini API key" placeholder="Paste your Gemini API key">
      <p class="err" id="keyErr" role="alert"></p>
      <button class="go" id="keyGo" type="submit">Connect</button>
      <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Get a Gemini API key</a>
    </form>
  </div>
<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
let socket;
function state(mode, text) {
  $('core').className = 'core lit ' + mode;
  if (text) $('line').textContent = text;
}
$('p-key').onsubmit = event => {
  event.preventDefault();
  const key = $('key').value.trim();
  if (!/^AIza[\w-]{20,}$/.test(key)) {
    $('keyErr').textContent = 'Paste a valid Gemini API key.';
    return;
  }
  $('p-key').classList.remove('on');
  $('keyErr').textContent = '';
  state('think', 'Connecting your voice…');
  socket = new WebSocket('ws://' + location.host + '/voice');
  let completed = false;
  socket.onopen = () => { socket.send(JSON.stringify({key})); $('key').value = ''; };
  socket.onmessage = event => {
    const message = JSON.parse(event.data);
    if (message.state === 'done') completed = true;
    if (message.state === 'error') {
      $('keyErr').textContent = message.text;
      $('p-key').classList.add('on');
    }
    state(message.state === 'done' ? 'awake' : message.state, message.text);
  };
  socket.onclose = () => {
    if (!completed) {
      $('p-key').classList.add('on');
      state('awake', 'Voice disconnected. Check your connection and reconnect.');
    }
  };
};
(async () => {
  await sleep(400); $('r1').classList.add('show');
  await sleep(700); $('r2').classList.add('show'); $('r3').classList.add('show');
  $('core').classList.add('lit');
  await sleep(1100); $('title').classList.add('on');
  await sleep(800); $('reactor').classList.add('small');
  state('awake', 'Welcome to JARVIS OS. Connect your key, then just speak with me.');
  $('p-key').classList.add('on'); $('key').focus();
})();
</script>
</body>
</html>
