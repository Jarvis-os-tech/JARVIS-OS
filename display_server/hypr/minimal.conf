# Standalone preview launched with bin/jarvis-de --minimal.
# Check this file without starting a compositor with bin/jarvis-de --verify-minimal.
monitor = , preferred, auto, auto

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

exec-once = jarvis-hud-preview
exec-once = systemctl --user start jarvis-voice.service

bind = SUPER, Return, exec, xdg-terminal-exec || foot
bind = SUPER, Q, killactive,
bind = SUPER, H, togglespecialworkspace, vault
bind = SUPER SHIFT, H, movetoworkspace, special:vault
bind = SUPER, L, exec, jarvis-lock
bind = SUPER, N, exec, jarvis-hud-preview ipc call jarvis-hud-preview toggleNotifications
bind = SUPER, space, exec, jarvis-hud-preview ipc call jarvis-hud-preview togglePalette
bind = SUPER SHIFT, J, exec, jarvis-hud-preview
bind = SUPER, V, exec, jarvis-voice-toggle voice
bind = SUPER, D, exec, jarvis-voice-toggle dictation
bind = SUPER SHIFT, V, exec, jarvis-voice standby toggle
bind = SUPER, Escape, exec, jarvis-voice listen cancel
bind = SUPER SHIFT, Escape, exit,

general {
    border_size = 1
    col.active_border = rgba(00e5ffee) rgba(ffb300ee) 45deg
    col.inactive_border = rgba(26405a88)
}

decoration {
    rounding = 16
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true
    bezier = hudPop, 0.22, 1, 0.36, 1
    animation = windowsIn, 1, 3, hudPop, popin 88%
}

layerrule = match:namespace ^jarvis-hud$, blur on
windowrule = match:class .+, float on
windowrule = match:class .+, size (monitor_w*0.44) (monitor_h*0.76)
windowrule = match:class .+, move (monitor_w*0.52) (monitor_h*0.12)
windowrule = match:class .+, opacity 0.92 0.88

bind = SUPER SHIFT, T, exec, xdg-terminal-exec || foot
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
